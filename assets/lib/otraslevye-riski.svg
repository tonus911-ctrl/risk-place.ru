<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Отраслевая специфика рисков при единой методологии"><rect width="640" height="330" fill="#FFFFFF"/><text x="320" y="38" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5C" text-anchor="middle">Методология одна, перечень существенных рисков свой</text><rect x="32" y="58" width="144" height="58" rx="9" fill="#F5F1E8" stroke="#E3D9C2" stroke-width="1.5"/><text x="104.0" y="82" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1B3A5C" text-anchor="middle">Нефтегаз</text><text x="104.0" y="99" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">промышленная</text><text x="104.0" y="113" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">безопасность</text><rect x="184" y="58" width="144" height="58" rx="9" fill="#FFFFFF" stroke="#E3D9C2" stroke-width="1.5"/><text x="256.0" y="82" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1B3A5C" text-anchor="middle">Металлургия</text><text x="256.0" y="99" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">гидротехника и</text><text x="256.0" y="113" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">непрерывность</text><rect x="336" y="58" width="144" height="58" rx="9" fill="#F5F1E8" stroke="#E3D9C2" stroke-width="1.5"/><text x="408.0" y="82" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1B3A5C" text-anchor="middle">Строительство</text><text x="408.0" y="99" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">исходные данные и</text><text x="408.0" y="113" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">подрядчики</text><rect x="488" y="58" width="144" height="58" rx="9" fill="#FFFFFF" stroke="#E3D9C2" stroke-width="1.5"/><text x="560.0" y="82" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1B3A5C" text-anchor="middle">Телеком</text><text x="560.0" y="99" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">доступность сети</text><rect x="32" y="126" width="144" height="58" rx="9" fill="#FFFFFF" stroke="#E3D9C2" stroke-width="1.5"/><text x="104.0" y="150" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1B3A5C" text-anchor="middle">ИТ</text><text x="104.0" y="167" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">данные и технический</text><text x="104.0" y="181" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">долг</text><rect x="184" y="126" width="144" height="58" rx="9" fill="#F5F1E8" stroke="#E3D9C2" stroke-width="1.5"/><text x="256.0" y="150" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1B3A5C" text-anchor="middle">Банк</text><text x="256.0" y="167" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">капитал и</text><text x="256.0" y="181" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">операционный риск</text><rect x="336" y="126" width="144" height="58" rx="9" fill="#FFFFFF" stroke="#E3D9C2" stroke-width="1.5"/><text x="408.0" y="150" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1B3A5C" text-anchor="middle">Розница</text><text x="408.0" y="167" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">потери и цепочка</text><text x="408.0" y="181" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">поставок</text><rect x="488" y="126" width="144" height="58" rx="9" fill="#F5F1E8" stroke="#E3D9C2" stroke-width="1.5"/><text x="560.0" y="150" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1B3A5C" text-anchor="middle">Малый бизнес</text><text x="560.0" y="167" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">кассовый разрыв и</text><text x="560.0" y="181" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#565A63" text-anchor="middle">один клиент</text><rect x="32" y="196" width="576" height="54" rx="11" fill="#FFFFFF" stroke="#7A1F2E" stroke-width="1.8"/><text x="320" y="220" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#7A1F2E" text-anchor="middle">Общими остаются шкалы, справочники и порядок эскалации</text><text x="320" y="239" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#565A63" text-anchor="middle">меняется перечень опасностей и глубина методов</text><text x="320" y="286" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#565A63" text-anchor="middle">Отраслевой разбор помогает не изобретать заново то,</text><text x="320" y="304" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#565A63" text-anchor="middle">что соседи по отрасли уже прошли</text></svg>