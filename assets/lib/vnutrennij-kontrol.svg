<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Контрольные процедуры, встроенные в бизнес-процесс"><rect width="640" height="330" fill="#FFFFFF"/><text x="30" y="38" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1B3A5C" text-anchor="start">Бизнес-процесс</text><path d="M40 118 L600 118" stroke="#E3D9C2" stroke-width="10" stroke-linecap="round"/><circle cx="96" cy="118" r="13" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="2.4"/><text x="96" y="90" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1E222B" text-anchor="middle">Заявка</text><circle cx="222" cy="118" r="13" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="2.4"/><text x="222" y="90" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1E222B" text-anchor="middle">Согласование</text><circle cx="348" cy="118" r="13" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="2.4"/><text x="348" y="90" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1E222B" text-anchor="middle">Оплата</text><circle cx="474" cy="118" r="13" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="2.4"/><text x="474" y="90" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1E222B" text-anchor="middle">Приемка</text><circle cx="580" cy="118" r="13" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="2.4"/><text x="580" y="90" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1E222B" text-anchor="middle">Отчет</text><path d="M222 131 L222 148 L140 148 L140 162" stroke="#7A1F2E" stroke-width="2" fill="none"/><path d="M140 170 L135 160 L145 160 Z" fill="#7A1F2E"/><rect x="56" y="172" width="168" height="52" rx="9" fill="#F5F1E8" stroke="#7A1F2E" stroke-width="