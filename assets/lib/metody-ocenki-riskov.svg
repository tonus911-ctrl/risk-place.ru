<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Развилка между качественной и количественной оценкой риска"><rect width="640" height="330" fill="#FFFFFF"/><rect x="230" y="36" width="180" height="50" rx="10" fill="#F5F1E8" stroke="#1B3A5C" stroke-width="1.8"/><text x="320" y="58" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5C" text-anchor="middle">Риск выявлен</text><text x="320" y="76" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#565A63" text-anchor="middle">нужна оценка</text><path d="M320 86 L320 104 M150 104 L490 104 M150 104 L150 122 M490 104 L490 122" stroke="#C9A94E" stroke-width="2.2" fill="none"/><path d="M150 130 L145 120 L155 120 Z" fill="#C9A94E"/><path d="M490 130 L485 120 L495 120 Z" fill="#C9A94E"/><rect x="28" y="132" width="270" height="140" rx="12" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="1.8"/><text x="46" y="160" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1B3A5C" text-anchor="start">Качественная</text><text x="46" y="180" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#565A63" text-anchor="start">шкалы и матрица</text><path d="M46 194 L280 194" stroke="#E3D9C2" stroke-width="1.4"/><text x="46" y="216" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1E222B" text-anchor="start">Часы на риск</text><text x="46" y="234" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#565A63" text-anchor="start">данных не требует</text><text x="46" y="254" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#565A63" text-anchor="start">Отвечает на вопрос</text><text x="46" y="268" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#1B3A5C" text-anchor="start">чем заняться первым</text><rect x="342" y="132" width="270" height="140" rx="12" fill="#FFFFFF" stroke="#7A1F2E" stroke-width="1.8"/><text x="360" y="160" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#7A1F2E" text-anchor="start">Количественная</text><text x="360" y="180" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#565A63" text-anchor="start">деньги и сценарии</text><path d="M360 194 L594 194" stroke="#E3D9C2" stroke-width="1.4"/><text x="360" y="216" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1E222B" text-anchor="start">Дни на риск</text><text x="360" y="234" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#565A63" text-anchor="start">нужна фактура</text><text x="360" y="254" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#565A63" text-anchor="start">Отвечает на вопрос</text><text x="360" y="268" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#7A1F2E" text-anchor="start">хватит ли резерва</text><rect x="132" y="288" width="376" height="32" rx="9" fill="#F5F1E8" stroke="#E3D9C2" stroke-width="1.4"/><text x="320" y="309" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1E222B" text-anchor="middle">Матрица отбирает 20, по верхним 5 считаем деньги</text></svg>