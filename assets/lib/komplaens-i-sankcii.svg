<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Направления комплаенса и три измерения оценки комплаенс-риска"><rect width="640" height="330" fill="#FFFFFF"/><text x="30" y="38" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1B3A5C" text-anchor="start">Направления комплаенса</text><rect x="30" y="56" width="246" height="38" rx="8" fill="#F5F1E8" stroke="#E3D9C2" stroke-width="1.4"/><text x="46" y="80" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1E222B" text-anchor="start">Антикоррупционный</text><rect x="30" y="100" width="246" height="38" rx="8" fill="#FFFFFF" stroke="#E3D9C2" stroke-width="1.4"/><text x="46" y="124" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1E222B" text-anchor="start">Антимонопольный</text><rect x="30" y="144" width="246" height="38" rx="8" fill="#F5F1E8" stroke="#E3D9C2" stroke-width="1.4"/><text x="46" y="168" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1E222B" text-anchor="start">Санкционный</text><rect x="30" y="188" width="246" height="38" rx="8" fill="#FFFFFF" stroke="#E3D9C2" stroke-width="1.4"/><text x="46" y="212" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1E222B" text-anchor="start">Экспортный контроль</text><rect x="30" y="232" width="246" height="38" rx="8" fill="#F5F1E8" stroke="#E3D9C2" stroke-width="1.4"/><text x="46" y="256" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1E222B" text-anchor="start">Персональные данные</text><path d="M284 146 L311 146" stroke="#C9A94E" stroke-width="2.2" fill="none"/><path d="M318 146 L309 141 L309 151 Z" fill="#C9A94E"/><rect x="330" y="56" width="280" height="80" rx="11" fill="#FFFFFF" stroke="#7A1F2E" stroke-width="1.9"/><text x="470" y="84" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#7A1F2E" text-anchor="middle">Единая процедура</text><text x="470" y="106" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#565A63" text-anchor="middle">требование, владелец, механизм,</text><text x="470" y="123" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#565A63" text-anchor="middle">мониторинг, доказательство</text><path d="M470 136 L470 156" stroke="#C9A94E" stroke-width="2.2"/><path d="M470 164 L465 154 L475 154 Z" fill="#C9A94E"/><rect x="330" y="170" width="280" height="36" rx="8" fill="#F5F1E8" stroke="#E3D9C2" stroke-width="1.4"/><text x="346" y="186" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1B3A5C" text-anchor="start">Тяжесть</text><text x="346" y="201" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#565A63" text-anchor="start">штраф, приостановка, дело</text><rect x="330" y="211" width="280" height="36" rx="8" fill="#F5F1E8" stroke="#E3D9C2" stroke-width="1.4"/><text x="346" y="227" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1B3A5C" text-anchor="start">Подверженность</text><text x="346" y="242" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#565A63" text-anchor="start">объем операций и география</text><rect x="330" y="252" width="280" height="36" rx="8" fill="#F5F1E8" stroke="#E3D9C2" stroke-width="1.4"/><text x="346" y="268" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1B3A5C" text-anchor="start">Надежность</text><text x="346" y="283" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#565A63" text-anchor="start">есть ли механизм и работает ли</text><text x="320" y="314" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#7A1F2E" text-anchor="middle">Аппетит по значительной части требований нулевой</text></svg>