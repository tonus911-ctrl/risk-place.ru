<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Безопасность КИИ: семь шагов и ключевые цифры"><rect width="640" height="330" fill="#FFFFFF"/><text x="30" y="38" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#7A1F2E">Безопасность КИИ: семь шагов</text><rect x="30" y="56" width="370" height="32" rx="16" fill="#F5F1E8" stroke="#E6DDCA" stroke-width="1.4"/><circle cx="50" cy="72" r="11" fill="#7A1F2E"/><text x="50" y="77" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="72" y="77" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#1E222B">Статус субъекта</text><rect x="30" y="94" width="370" height="32" rx="16" fill="#FFFFFF" stroke="#E6DDCA" stroke-width="1.4"/><circle cx="50" cy="110" r="11" fill="#7A1F2E"/><text x="50" y="115" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="72" y="115" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#1E222B">Сверка с перечнем 360-р</text><rect x="30" y="132" width="370" height="32" rx="16" fill="#F5F1E8" stroke="#E6DDCA" stroke-width="1.4"/><circle cx="50" cy="148" r="11" fill="#7A1F2E"/><text x="50" y="153" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="72" y="153" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#1E222B">Комиссия</text><rect x="30" y="170" width="370" height="32" rx="16" fill="#FFFFFF" stroke="#E6DDCA" stroke-width="1.4"/><circle cx="50" cy="186" r="11" fill="#7A1F2E"/><text x="50" y="191" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="72" y="191" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#1E222B">Категорирование и акт</text><rect x="30" y="208" width="370" height="32" rx="16" fill="#F5F1E8" stroke="#E6DDCA" stroke-width="1.4"/><circle cx="50" cy="224" r="11" fill="#7A1F2E"/><text x="50" y="229" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="72" y="229" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#1E222B">Сведения во ФСТЭК за 10 дней</text><rect x="30" y="246" width="370" height="32" rx="16" fill="#FFFFFF" stroke="#E6DDCA" stroke-width="1.4"/><circle cx="50" cy="262" r="11" fill="#7A1F2E"/><text x="50" y="267" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="72" y="267" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#1E222B">Ответственный и защита</text><rect x="30" y="284" width="370" height="32" rx="16" fill="#F5F1E8" stroke="#E6DDCA" stroke-width="1.4"/><circle cx="50" cy="300" r="11" fill="#7A1F2E"/><text x="50" y="305" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="72" y="305" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#1E222B">Инциденты: 3 и 24 часа</text><rect x="425" y="56" width="185" height="260" rx="14" fill="#F5F1E8" stroke="#E6DDCA" stroke-width="1.4"/><text x="517" y="96" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="34" font-weight="700" fill="#7A1F2E" text-anchor="middle">396</text><text x="517" y="118" font-family="'Golos Text','Segoe UI',Arial,sans-serif" font-size="12.5" fill="#1E222B" text-anchor="middle">типовых объектов</text><text x="517" y="134" font-fami