<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Три линии защиты и подотчетность совету директоров"><rect width="640" height="330" fill="#FFFFFF"/><text x="320" y="36" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1B3A5C" text-anchor="middle">Три линии защиты</text><rect x="32" y="56" width="470" height="64" rx="11" fill="#F5F1E8" stroke="#1B3A5C" stroke-width="1.9"/><text x="52" y="82" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1B3A5C" text-anchor="start">Первая линия</text><text x="52" y="102" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#565A63" text-anchor="start">Руководители процессов · владеют рисками, выполняют контроли</text><rect x="32" y="130" width="470" height="64" rx="11" fill="#F5F1E8" stroke="#7A1F2E" stroke-width="1.9"/><text x="52" y="156" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#7A1F2E" text-anchor="start">Вторая линия</text><text x="52" y="176" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#565A63" text-anchor="start">Риски, контроль, комплаенс · методология, координация, оспаривание</text><rect x="32" y="204" width="470" height="64" rx="11" fill="#F5F1E8" stroke="#C9A94E" stroke-width="1.9"/><text x="52" y="230" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#C9A94E" text-anchor="start">Третья линия</text><text x="52" y="250" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#565A63" text-anchor="start">Внутренний аудит · независимая оценка, подчинен совету</text><rect x="516" y="56" width="92" height="212" rx="11" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="1.9"/><text transform="translate(556,240) rotate(-90)" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1B3A5C">Совет директоров</text><path d="M506 88 L512 88 M506 162 L512 162 M506 236 L512 236" stroke="#C9A94E" stroke-width="2.4"/><text x="320" y="296" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#565A63" text-anchor="middle">Культуру видно не в документах, а в том, как быстро</text><text x="320" y="314" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#7A1F2E" text-anchor="middle">плохие новости доходят до руководства</text></svg>