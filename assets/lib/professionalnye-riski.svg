<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Иерархия мер снижения профессионального риска от устранения до средств защиты"><rect width="640" height="330" fill="#FFFFFF"/><text x="320" y="36" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#1B3A5C" text-anchor="middle">Иерархия мер снижения профессионального риска</text><rect x="195.0" y="54" width="250" height="43" rx="9" fill="#F5F1E8" stroke="#7A1F2E" stroke-width="1.8"/><text x="320" y="74" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#7A1F2E" text-anchor="middle">Исключение опасности</text><text x="320" y="90" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#565A63" text-anchor="middle">убрать источник</text><rect x="160.0" y="102" width="320" height="43" rx="9" fill="#FFFFFF" stroke="#7A1F2E" stroke-width="1.8"/><text x="320" y="122" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#7A1F2E" text-anchor="middle">Замена</text><text x="320" y="138" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#565A63" text-anchor="middle">менее опасное решение</text><rect x="125.0" y="150" width="390" height="43" rx="9" fill="#F5F1E8" stroke="#1B3A5C" stroke-width="1.8"/><text x="320" y="170" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1B3A5C" text-anchor="middle">Инженерные средства</text><text x="320" y="186" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#565A63" text-anchor="middle">ограждения, блокировки, вентиляция</text><rect x="90.0" y="198" width="460" height="43" rx="9" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="1.8"/><text x="320" y="218" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1B3A5C" text-anchor="middle">Административные меры</text><text x="320" y="234" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#565A63" text-anchor="middle">наряд-допуск, обучение, ротация</text><rect x="55.0" y="246" width="530" height="43" rx="9" fill="#F5F1E8" stroke="#C9A94E" stroke-width="1.8"/><text x="320" y="266" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#C9A94E" text-anchor="middle">Средства защиты</text><text x="320" y="282" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#565A63" text-anchor="middle">последний барьер</text><path d="M26 60 L26 280" stroke="#E3D9C2" stroke-width="2.4"/><path d="M26 60 L21 72 L31 72 Z" fill="#7A1F2E"/><text transform="translate(19,244) rotate(-90)" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#565A63">надежнее</text><text x="320" y="316" font-family="Figtree, Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#565A63" text-anchor="middle">Переход вниз допустим при обоснованной невозможности верхнего уровня</text></svg>