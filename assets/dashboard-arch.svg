<svg class="fig bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 552" font-family="'Golos Text','Segoe UI',Arial,sans-serif" role="img" aria-label="Схема: как устроен дашборд рисков проектов, от реестра в Excel до экрана управляющего комитета">
<title>Как устроен дашборд рисков проектов</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="552" fill="#FFFFFF"/>
<text x="340" y="30" font-size="14" font-weight="600" fill="#1E222B" text-anchor="middle">Дашборд рисков проектов — как это устроено</text>
<rect x="28" y="48" width="624" height="404" rx="10" fill="none" stroke="#E3D9C2" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="640" y="70" font-size="12" fill="#565A63" text-anchor="end">контур клиента · данные не покидают компанию</text>
<circle cx="52" cy="118" r="8" fill="#565A63"/><path d="M40 150 Q52 128 64 150 Z" fill="#565A63"/>
<text x="52" y="166" font-size="12" fill="#565A63" text-anchor="middle">координатор</text>
<line x1="68" y1="130" x2="90" y2="130" stroke="#565A63" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="94" y="86" width="156" height="130" rx="8" fill="#EDE7F0" stroke="#7A1F2E" stroke-width="1.5"/>
<text x="106" y="106" font-size="12" fill="#7A1F2E">УРОВЕНЬ 1 · СТАРТ</text><text x="106" y="128" font-size="14" font-weight="600" fill="#1E222B">Реестр в Excel</text>
<text x="106" y="150" font-size="12" fill="#7A1F2E">методология уже внутри</text><text x="106" y="168" font-size="12" fill="#565A63">форма + инструкция</text><text x="106" y="186" font-size="12" fill="#565A63">показатели выбраны</text><text x="106" y="204" font-size="12" fill="#565A63">заполняйте с 1 дня</text>
<line x1="172" y1="220" x2="172" y2="246" stroke="#565A63" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#ah)"/>
<text x="180" y="238" font-size="12" fill="#565A63">апгрейд позже</text>
<rect x="40" y="252" width="210" height="74" rx="8" fill="#F6E9C9" stroke="#C9A94E" stroke-width="1.5"/>
<text x="52" y="272" font-size="12" fill="#8A6D1E">УРОВЕНЬ 2 · ИНТЕГРАЦИЯ</text><text x="52" y="294" font-size="14" font-weight="600" fill="#1E222B">Ваши системы-источники</text><text x="52" y="314" font-size="12" fill="#565A63">MS Project · Primavera · ERP · BI</text>
<line x1="145" y1="326" x2="145" y2="348" stroke="#565A63" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="155" y="342" font-size="12" fill="#565A63">ИТ-проект у вас</text>
<rect x="40" y="350" width="210" height="92" rx="8" fill="#F6E9C9" stroke="#C9A94E" stroke-width="1.5"/>
<text x="52" y="372" font-size="14" font-weight="600" fill="#1E222B">Витрина данных — создать</text><text x="52" y="392" font-size="12" fill="#565A63">график, бюджет, реестр рисков</text><text x="52" y="410" font-size="12" fill="#565A63">дизайн и маппинг — мы</text><text x="52" y="428" font-size="12" fill="#565A63">подключение — ваше ИТ</text>
<line x1="250" y1="140" x2="286" y2="158" stroke="#565A63" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="266" y="132" font-size="12" fill="#565A63" text-anchor="middle">pull</text>
<line x1="250" y1="388" x2="286" y2="240" stroke="#565A63" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="268" y="314" font-size="12" fill="#565A63" text-anchor="middle">API</text>
