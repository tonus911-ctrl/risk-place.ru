<text x="302" y="144" font-size="14" font-weight="600" fill="#1E222B">Движок дашборда</text><text x="302" y="162" font-size="12" fill="#565A63">скрипт Python</text><text x="302" y="186" font-size="12" fill="#565A63">работает у вас:</text><text x="302" y="204" font-size="12" fill="#565A63">ноутбук·сервер·облако</text><text x="302" y="222" font-size="12" fill="#565A63">проверяет и собирает</text>
<line x1="365" y1="250" x2="365" y2="276" stroke="#565A63" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="290" y="280" width="150" height="74" rx="8" fill="#FFFFFF" stroke="#B8AE96" stroke-width="1.5"/>
<text x="302" y="302" font-size="14" font-weight="600" fill="#1E222B">История</text><text x="302" y="322" font-size="12" fill="#565A63">SQLite (легкая БД)</text><text x="302" y="340" font-size="12" fill="#565A63">снимки · тренды по периодам</text>
<line x1="440" y1="166" x2="466" y2="166" stroke="#565A63" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="470" y="86" width="170" height="214" rx="8" fill="#FFFFFF" stroke="#1E222B" stroke-width="2"/>
<text x="482" y="108" font-size="14" font-weight="600" fill="#1E222B">Дашборд проекта</text><text x="482" y="126" font-size="12" fill="#565A63">один HTML · офлайн</text>
<path d="M521 184 A34 34 0 0 1 589 184" fill="none" stroke="#E8DFC6" stroke-width="7" stroke-linecap="round"/>
<path d="M521 184 A34 34 0 0 1 583 163" fill="none" stroke="#C9A94E" stroke-width="7" stroke-linecap="round"/>
<text x="555" y="180" font-size="14" font-weight="600" fill="#1E222B" text-anchor="middle">62</text><text x="555" y="202" font-size="12" fill="#565A63" text-anchor="middle">индекс здоровья рисков</text>
<circle cx="492" cy="222" r="5" fill="#1B6B4A"/><text x="504" y="226" font-size="12" fill="#565A63">владельцы назначены</text>
<circle cx="492" cy="240" r="5" fill="#C9A94E"/><text x="504" y="244" font-size="12" fill="#565A63">3 мероприятия просрочены</text>
<circle cx="492" cy="258" r="5" fill="#B0392E"/><text x="504" y="262" font-size="12" fill="#565A63">5 рисков в красной зоне</text>
<circle cx="492" cy="276" r="5" fill="#C9A94E"/><text x="504" y="280" font-size="12" fill="#565A63">индикаторы не по всем рискам</text>
<line x1="555" y1="300" x2="555" y2="320" stroke="#565A63" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="555" cy="334" r="9" fill="#1E222B"/><path d="M539 372 Q555 344 571 372 Z" fill="#1E222B"/>
<text x="555" y="390" font-size="12" fill="#565A63" text-anchor="middle">Комитет · Заказчик · Проектный офис</text>
<path d="M 555 398 V 486 H 145 V 450" fill="none" stroke="#7A1F2E" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="350" y="478" font-size="12" fill="#7A1F2E" text-anchor="middle">опция: ежемесячный сервис — соберем данные и пересоберем</text>
<text x="340" y="514" font-size="12" fill="#565A63" text-anchor="middle">pull — движок сам читает ваш реестр по расписанию</text>
<text x="340" y="532" font-size="12" fill="#565A63" text-anchor="middle">API — движок забирает сам, или ваша витрина отправляет</text>
</svg>