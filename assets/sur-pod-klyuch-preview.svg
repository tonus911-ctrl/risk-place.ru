<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" role="img" aria-label="Система управления рисками под ключ">
<rect width="1060" height="560" rx="18" fill="#FFFFFF"/>
<text x="40" y="52" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="24" font-weight="700" fill="#1E222B" text-anchor="start">Система управления рисками под ключ</text>
<text x="40" y="80" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="15" font-weight="500" fill="#7A5E17" text-anchor="start">1–2 месяца · четыре шага · система остается в компании</text>
<line x1="40" y1="180" x2="1024" y2="180" stroke="#E3D9C2" stroke-width="2"/>
<rect x="40" y="128" width="228" height="104" rx="14" fill="#F5F1E8" stroke="#E3D9C2"/>
<circle cx="70" cy="162" r="16" fill="#C9A94E"/>
<text x="70" y="167" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="13" font-weight="800" fill="#1E222B" text-anchor="middle">01</text>
<text x="96" y="168" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="20" font-weight="800" fill="#1B3A5C" text-anchor="start">Аудит</text>
<text x="96" y="192" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#565A63" text-anchor="start">зрелость по ГОСТ 70350</text>
<text x="56" y="284" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1E222B" text-anchor="start">уровень зрелости, пробелы,</text>
<text x="56" y="304" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1E222B" text-anchor="start">план работ на два месяца</text>
<path d="M272,180 L288,180" stroke="#C9A94E" stroke-width="2.5"/>
<path d="M283,174 L289,180 L283,186" fill="none" stroke="#C9A94E" stroke-width="2.5"/>
<rect x="292" y="128" width="228" height="104" rx="14" fill="#F5F1E8" stroke="#E3D9C2"/>
<circle cx="322" cy="162" r="16" fill="#C9A94E"/>
<text x="322" y="167" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="13" font-weight="800" fill="#1E222B" text-anchor="middle">02</text>
<text x="348" y="168" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="20" font-weight="800" fill="#1B3A5C" text-anchor="start">Документы</text>
<text x="348" y="192" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#565A63" text-anchor="start">политика и положение</text>
<text x="308" y="284" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1E222B" text-anchor="start">политика, положение о системе,</text>
<text x="308" y="304" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1E222B" text-anchor="start">регламент обновления</text>
<path d="M524,180 L540,180" stroke="#C9A94E" stroke-width="2.5"/>
<path d="M535,174 L541,180 L535,186" fill="none" stroke="#C9A94E" stroke-width="2.5"/>
<rect x="544" y="128" width="228" height="104" rx="14" fill="#F5F1E8" stroke="#E3D9C2"/>
<circle cx="574" cy="162" r="16" fill="#C9A94E"/>
<text x="574" y="167" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="13" font-weight="800" fill="#1E222B" text-anchor="middle">03</text>
<text x="600" y="168" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="20" font-weight="800" fill="#1B3A5C" text-anchor="start">Реестр</text>
<text x="600" y="192" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#565A63" text-anchor="start">и карта рисков</text>
<text x="560" y="284" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1E222B" text-anchor="start">реестр с владельцами, карта,</text>
<text x="560" y="304" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1E222B" text-anchor="start">аппетит к риску, KRI</text>
<path d="M776,180 L792,180" stroke="#C9A94E" stroke-width="2.5"/>
<path d="M787,174 L793,180 L787,186" fill="none" stroke="#C9A94E" stroke-width="2.5"/>
<rect x="796" y="128" width="228" height="104" rx="14" fill="#F5F1E8" stroke="#E3D9C2"/>
<circle cx="826" cy="162" r="16" fill="#C9A94E"/>
<text x="826" y="167" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="13" font-weight="800" fill="#1E222B" text-anchor="middle">04</text>
<text x="852" y="168" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="20" font-weight="800" fill="#1B3A5C" text-anchor="start">Отчет</text>
<text x="852" y="192" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#565A63" text-anchor="start">совету директоров</text>
<text x="812" y="284" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1E222B" text-anchor="start">оценка в деньгах, отчет</text>
<text x="812" y="304" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1E222B" text-anchor="start">и дашборд для совета</text>
<text x="40" y="260" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="13" font-weight="700" fill="#7A5E17" text-anchor="start">Что остается в компании</text>
<rect x="40" y="356" width="980" height="150" rx="16" fill="#1B3A5C"/>
<text x="68" y="398" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="15" font-weight="700" fill="#C9A94E" text-anchor="start">Что остается</text>
<text x="68" y="434" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">документы · реестр и карта · обученный риск-менеджер · отчет совету</text>
<text x="68" y="484" font-family="'Figtree','Manrope',Arial,sans-serif" font-size="14" font-weight="400" fill="#C7CDD6" text-anchor="start">Аутсорсинг функции, внутренний контроль и отраслевой риск-сюрвей включаются по задаче и входят в единый расчет</text>
</svg>
